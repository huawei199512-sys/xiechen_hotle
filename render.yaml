services:
  - type: web
    name: api-ctrip
    # Dockerfile build（Playwright 官方镜像已预装 Chromium）
    env: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: Dockerfile
    preDeployCommand: ""
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: CTRIP_HEADLESS
        value: "1"
