services:
  - type: web
    name: api-ctrip
    env: node
    plan: free
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: npm start
    healthCheckPath: /health
    rootDir: .
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CTRIP_HEADLESS
        value: "1"
